queue_rules:
  - name: barrier
    queue_conditions: &queue_conditions
      - base=master
      - check-success=@github-actions/pr-fast
      - head-repo-full-name=blogle/latchkey
      - -draft
      - linear-history
      - -conflict
      - label != blocked
      - label != blocker
      - label != hold
      - title ~= LATCH-[0-9]+
    merge_conditions: &merge_conditions
      - check-success=@github-actions/candidate-ready
    batch_size: 1
    merge_method: squash
    update_method: rebase
    branch_protection_injection_mode: merge

  - name: default
    queue_conditions: *queue_conditions
    merge_conditions: *merge_conditions
    batch_size: 3
    merge_method: squash
    update_method: rebase
    branch_protection_injection_mode: merge

merge_queue:
  reset_on_external_merge: always

pull_request_rules:
  - name: queue shared-interface changes as a single candidate
    conditions:
      - base=master
      - files ~= ^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|flake\.nix|flake\.lock|\.mergify\.yml|\.github/workflows/|\.changes/README\.md|docs/(contracts|ci)\.md|release-policy\.toml|src/(contracts|catalog|router|config|downstream|server|controller|lib)\.rs|crds/|ci/(capabilities|gates|release-policy)\.toml|scripts/(release|ci/(candidate|prefix_runner|resolve_candidate_batch|validate_candidate_event|repository-policy)\.py))
    actions:
      queue:
        name: barrier

  - name: queue ordinary compatible changes
    conditions:
      - base=master
      - -files ~= ^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|flake\.nix|flake\.lock|\.mergify\.yml|\.github/workflows/|\.changes/README\.md|docs/(contracts|ci)\.md|release-policy\.toml|src/(contracts|catalog|router|config|downstream|server|controller|lib)\.rs|crds/|ci/(capabilities|gates|release-policy)\.toml|scripts/(release|ci/(candidate|prefix_runner|resolve_candidate_batch|validate_candidate_event|repository-policy)\.py))
    actions:
      queue:
        name: default
