# The single source of truth for the Rust toolchain.
#
# The Nix flake reads this file via rust-bin.fromRustupToolchainFile, so this
# channel, these components, and these targets are what every Cargo invocation
# in the repository uses. Nothing else in the repository pins a Rust version.
[toolchain]
channel = "1.96.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = ["x86_64-unknown-linux-musl"]
